[package]
name = "island-walkman"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
id3 = "1.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
walkdir = "2"
encoding_rs = "0.8"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true

