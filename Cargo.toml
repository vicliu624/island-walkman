[package]
name = "island-walkman"
version = "0.3.0"
edition = "2024"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

anyhow = "1"
id3 = "1.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
walkdir = "2"
encoding_rs = "0.8"
fs2 = "0.4"
nusb = "0.2.8"
des = "0.8"
md5 = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true

