name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, platform: windows, arch: x86_64, target: x86_64-pc-windows-msvc, bundles: nsis, suffix: '.exe'}
          - {os: ubuntu-22.04, platform: debian, arch: x86_64, target: x86_64-unknown-linux-gnu, bundles: 'deb,appimage', suffix: ''}
          - {os: macos-14, platform: macos, arch: aarch64, target: aarch64-apple-darwin, bundles: 'app,dmg', suffix: ''}
          - {os: macos-15-intel, platform: macos, arch: x86_64, target: x86_64-apple-darwin, bundles: 'app,dmg', suffix: ''}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          rustup target add '${{ matrix.target }}'
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xvfb
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-1.95-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci
      - name: Build frontend and validate translations
        working-directory: ui
        run: npm run build
      - name: Collect dependency notices
        run: python tools/collect-notices.py
      - name: Validate source and documentation
        run: |
          cargo fmt --check
          python tools/check-docs.py
          python -m unittest discover -s tools -p "test_*.py"
      - name: Test Rust
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build desktop installers and signed updates
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          NO_STRIP: 'true'
        run: |
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo 'Distribution signing secret is required'; exit 1; fi
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx --prefix ui tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' "${extra[@]}"
      - name: Test local preparation and server regression
        run: python tools/smoke.py --executable target/${{ matrix.target }}/release/island-walkman${{ matrix.suffix }}
      - name: Test real desktop window on Windows
        if: runner.os == 'Windows'
        run: python tools/desktop-smoke.py --executable target/${{ matrix.target }}/release/island-walkman.exe
      - name: Test real desktop window on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/desktop-smoke.py --executable target/${{ matrix.target }}/release/island-walkman
      - name: Test installed Windows application and shortcut choices
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./tools/test-windows-install.ps1 -Installer $installer.FullName
      - name: Test installed Debian application
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i target/${{ matrix.target }}/release/bundle/deb/*.deb
          xvfb-run -a python tools/desktop-smoke.py --installed --executable /usr/bin/island-walkman
      - name: Stage release assets
        run: python tools/stage-release.py --bundle target/${{ matrix.target }}/release/bundle --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: island-walkman-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/native/*
          if-no-files-found: error
          retention-days: 14
