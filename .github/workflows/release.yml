name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish using corrected publisher metadata
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test release metadata generation
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Download successful build with identical application inputs
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&status=success&event=push" --jq '[.workflow_runs[] | select(.head_branch == "main")][0].id')
          if [ -z "$run_id" ] || [ "$run_id" == null ]; then
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?status=success&event=push" --jq '[.workflow_runs[] | select(.head_branch == "main")][0].id')
          fi
          if [ -z "$run_id" ] || [ "$run_id" == null ]; then echo 'A successful desktop build is required'; exit 1; fi
          run_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')
          git merge-base --is-ancestor "$run_sha" "$GITHUB_SHA"
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$tag_sha" "$GITHUB_SHA"
          git diff --quiet "$run_sha" "$tag_sha" -- Cargo.toml Cargo.lock src ui tauri.conf.json windows icons build.rs
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/release.yml|tools/release-manifest.py|tools/test_release_manifest.py|docs/DISTRIBUTION.md|'') ;;
              *) echo "Application build inputs changed after the successful build: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$run_sha" "$GITHUB_SHA")
          echo "source_commit=$run_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run download "$run_id" --dir release-assets
      - name: Record artifact provenance
        env:
          BUILD_COMMIT: ${{ steps.build.outputs.source_commit }}
          BUILD_RUN: ${{ steps.build.outputs.run_id }}
        run: |
          export TAG_COMMIT=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          python -c "import json,os,pathlib; pathlib.Path('release-assets/build-provenance.json').write_text(json.dumps({'tag_commit':os.environ['TAG_COMMIT'],'native_build_commit':os.environ['BUILD_COMMIT'],'native_build_run':os.environ['BUILD_RUN']},indent=2)+'\n',encoding='utf-8')"
      - name: Generate complete signed updater feed
        run: python tools/release-manifest.py --artifacts release-assets --version "${RELEASE_TAG#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          python -c "import json,pathlib; pathlib.Path('release-notes.md').write_text(json.loads(pathlib.Path('release-assets/latest.json').read_text())['notes'],encoding='utf-8')"
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --title "Island Walkman $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
